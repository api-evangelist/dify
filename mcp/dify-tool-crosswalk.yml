description: >-
  Binding between the tools Dify's live MCP server exposes and the operations its published OpenAPI
  describes. The two surfaces do not overlap at all: the MCP server is scoped to the documentation
  site, and the OpenAPI describes the runtime Service API. Every MCP tool is mcp_only and every REST
  operation is rest_only. Recording that divergence is the point — an agent that connects to
  https://docs.dify.ai/mcp can read Dify's docs but cannot call a single Dify app.
