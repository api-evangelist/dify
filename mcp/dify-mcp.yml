description: 'Dify''s MCP posture has two distinct surfaces. (1) A live, anonymous, remote documentation
  MCP server at https://docs.dify.ai/mcp, confirmed by an unauthenticated tools/list call that returned
  three real tools with input schemas — saved verbatim to dify-mcp-tools.json. (2) A per-application MCP
  server feature: any Dify app owner can toggle "MCP Server" on the app''s Access Point tab and Dify mints
  a unique, credential-bearing MCP URL for that one app. There is no single vendor-wide MCP endpoint for
  the Dify Service API.'
