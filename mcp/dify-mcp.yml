      language:
        type: string
        required: false
        description: Filter to a language code (e.g. 'zh', 'es'); defaults to 'en'
  - name: query_docs_filesystem_dify_docs
    description: Run a read-only shell-like query against a virtualized in-memory filesystem containing
      only the Dify docs pages and OpenAPI specs.
    input_schema:
      command:
        type: string
        required: true
        description: A read-only shell command against the virtual docs filesystem
  - name: submit_feedback
    title: Submit documentation feedback
    description: Report a problem with a documentation page so the docs team can fix it.
    input_schema:
      path:
        type: string
        required: true
      feedback:
        type: string
