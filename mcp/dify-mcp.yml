tenant_servers:
  available: true
  shape: per-application
  docs: https://docs.dify.ai/en/cloud/use-dify/publish/publish-mcp
  note: Enabled per app on the Access Point tab. The generated URL embeds the credential, so it is tenant-specific
    and cannot be catalogued as a public endpoint. Clients tested by Dify's docs are Claude Desktop (Integrations)
    and Cursor (.cursor/mcp.json).
  regenerable: true
mcp_client_side:
  note: Dify is also an MCP CLIENT — workflows and agents can consume external MCP tools. See https://docs.dify.ai/en/cloud/use-dify/workspace/tools#mcp.
    That is a consumption surface, not a server Dify publishes.
