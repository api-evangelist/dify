method: searched
source: >-
  registry.npmjs.org, pypi.org, rubygems.org, proxy.golang.org, search.maven.org, and the
  langgenius GitHub organization repository listing
description: >-
  First-party Dify client libraries and developer tooling. Dify's SDK estate is unusually
  fragmented: the Node client is current, the published Python client is two years behind the
  repository that produces it, and the Java, Ruby and documentation-MCP SDK repositories are all
  archived. Version and published date are read from each registry's metadata endpoint.
findings:
  - >-
    ABANDONMENT SIGNAL: pypi dify-client 0.1.10 was last published 2023-11-15 and describes an API
    surface of a handful of endpoints, while the Service API Dify published in 2026 carries 82
    operations. langgenius/dify-python-sdk carries version 0.1.12 in its pyproject.toml, so even the
    repository is ahead of what is on PyPI.
  - >-
    langgenius/java-client declares ai.dify:java-client 1.0.0 in its pom.xml but nothing under the
    ai.dify group is published to Maven Central; the repository is archived.
  - >-
    langgenius/ruby-sdk builds dify-client.gemspec, but the gem published to RubyGems is named
    dify_client and its last release is 0.1.0 (2023-07-18). The repository is archived.
  - >-
    langgenius/dify-sdk-go has no tags, so the Go module proxy only offers a pseudo-version from the
    2024-10-31 commit.
