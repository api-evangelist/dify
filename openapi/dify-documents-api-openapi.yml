                  description: JSON string containing configuration. Accepts the same fields as [Create Document by Text](/en/api-reference/documents/create-document-by-text) (`doc_form`, `doc_language`, `process_rule`, `retrieval_model`, `embedding_model`, `embedding_model_provider`) except `name` and `text`.
                  example: '{"doc_form":"text_model","doc_language":"English","process_rule":{"mode":"automatic"}}'
      responses:
        '200':
          description: Document updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    $ref: '#/components/schemas/Document'
                  batch:
                    type: string
                    description: Batch ID for tracking indexing progress.
              examples:
                success:
                  summary: Response Example
                  value:
                    document:
                      id: a8e0e5b5-78c6-4130-a5ce-25feb0e0b4ac
                      position: 1
                      data_source_type: upload_file
                      data_source_info:
                        upload_file_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                      data_source_detail_dict:
                        upload_file:
                          id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                          name: guide.txt
                          size: 2048
                          extension: txt
                          mime_type: text/plain
                          created_by: ad313dd6-ef04-4dd1-a5b0-c0f0b9e2e7e4
                          created_at: 1741267200
                      dataset_process_rule_id: e1f2a3b4-c5d6-7890-ef12-345678901234
                      name: guide.txt
                      created_from: api
                      created_by: ad313dd6-ef04-4dd1-a5b0-c0f0b9e2e7e4
                      created_at: 1741267200
                      tokens: 512
                      indexing_status: completed
                      error: null
                      enabled: true
                      disabled_at: null
                      disabled_by: null
                      archived: false
                      display_status: available
                      word_count: 350
                      hit_count: 0
                      doc_form: text_model
                      doc_metadata: []
                      summary_index_status: null
                      need_summary: false
                    batch: '20250306150245647595'
        '400':
          description: '- `too_many_files` : Only one file is allowed per request.

            - `filename_not_exists_error` : The uploaded file has no filename.

            - `provider_not_initialize` : No model provider credentials are configured for the workspace.

            - `invalid_param` : The document is not available for update (only available documents can be updated).'
          content:
            application/json:
              examples:
                too_many_files:
                  summary: too_many_files
                  value:
                    status: 400
                    code: too_many_files
                    message: Only one file is allowed.
                filename_not_exists_error:
                  summary: filename_not_exists_error
                  value:
                    status: 400
                    code: filename_not_exists_error
                    message: The specified filename does not exist.
                provider_not_initialize:
                  summary: provider_not_initialize
                  value:
                    status: 400
                    code: provider_not_initialize
                    message: No valid model provider credentials found. Please go to Settings -> Model Provider to complete your provider credentials.
                invalid_param_not_available:
                  summary: invalid_param (not available)
                  value:
                    status: 400
                    code: invalid_param
                    message: Document is not available
        '403':
          description: '- `forbidden` : Knowledge base API access is not enabled.

            - `forbidden` : The capacity of the vector space has reached the limit of your subscription.

            - `forbidden` : Sorry, you have reached the knowledge base request rate limit of your subscription.'
          content:
            application/json:
              examples:
                forbidden_1:
                  summary: forbidden (api access)
                  value:
                    status: 403
                    code: forbidden
                    message: Dataset api access is not enabled.
                forbidden_2:
                  summary: forbidden (vector space)
                  value:
                    status: 403
                    code: forbidden
                    message: The capacity of the vector space has reached the limit of your subscription.
                forbidden_3:
                  summary: forbidden (rate limit)
                  value:
                    status: 403
                    code: forbidden
                    message: Sorry, you have reached the knowledge base request rate limit of your subscription.
        '404':
          description: '- `not_found` : Knowledge base not found.

            - `not_found` : Document not found.'
          content:
            application/json:
              examples:
                not_found_1:
                  summary: not_found
                  value:
                    status: 404
                    code: not_found
                    message: Dataset not found.
                not_found_2:
                  summary: not_found
                  value:
                    status: 404
                    code: not_found
                    message: Document not found.
        '413':
          description: '`file_too_large` : The uploaded file exceeds the maximum size.'
          content:
            application/json:
              examples:
                file_too_large:
                  summary: file_too_large
                  value:
                    status: 413
                    code: file_too_large
                    message: File size exceeded.
        '415':
          description: '`unsupported_file_type` : The uploaded file''s type is not supported.'
          content:
            application/json:
              examples:
                unsupported_file_type:
                  summary: unsupported_file_type
                  value:
                    status: 415
                    code: unsupported_file_type
                    message: File type not allowed.
        '503':
          description: '`service_unavailable` : Vector space usage could not be verified. Returned on the Dify Cloud Sandbox plan only; retry the request later.'
          content:
            application/json:
              examples:
                service_unavailable:
                  summary: service_unavailable
                  value:
                    status: 503
                    code: service_unavailable
                    message: Unable to verify vector space usage right now. Please try again later.
      deprecated: true
      x-mint:
        href: /en/api-reference/documents/update-document-by-file
        metadata:
          title: Update Document by File
          sidebarTitle: Update Document by File
  /datasets/{dataset_id}/documents/download-zip:
    post:
      tags:
      - Documents
      summary: Download Documents as ZIP
      description: Downloads one or more documents as a single ZIP archive. Only documents that were uploaded as files can be included.
      operationId: downloadDocumentsZip
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Knowledge base ID. From [List Knowledge Bases](/en/api-reference/knowledge-bases/list-knowledge-bases).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - document_ids
              properties:
                document_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    format: uuid
                  description: Document IDs to include in the archive. Get them from [List Documents](/en/api-reference/documents/list-documents).
      responses:
        '200':
          description: ZIP archive containing the requested documents.
          content:
            application/zip:
              schema:
                type: string
                format: binary
                description: ZIP archive binary stream.
        '403':
          description: '- `forbidden` : Knowledge base API access is not enabled.

            - `forbidden` : Sorry, you have reached the knowledge base request rate limit of your subscription.

            - `forbidden` : You do not have permission to access this knowledge base.

            - `forbidden` : You do not have permission for one of the requested documents.'
          content:
            application/json:
              examples:
                forbidden_1:
                  summary: forbidden (api access)
                  value:
                    status: 403
                    code: forbidden
                    message: Dataset api access is not enabled.
                forbidden_2:
                  summary: forbidden (rate limit)
                  value:
                    status: 403
                    code: forbidden
                    message: Sorry, you have reached the knowledge base request rate limit of your subscription.
                forbidden_3:
                  summary: forbidden (dataset permission)
                  value:
                    status: 403
                    code: forbidden
                    message: You do not have permission to access this dataset.
                forbidden_4:
                  summary: forbidden (document permission)
                  value:
                    status: 403
                    code: forbidden
                    message: No permission.
        '404':
          description: '- `not_found` : Document not found.

            - `not_found` : Knowledge base not found. Also returned as "Only uploaded-file documents can be downloaded as ZIP." when a requested document has no uploaded file.'
          content:
            application/json:
              examples:
                not_found_1:
                  summary: not_found
                  value:
                    status: 404
                    code: not_found
                    message: Document not found.
                not_found_2:
                  summary: not_found
                  value:
                    status: 404
                    code: not_found
                    message: Dataset not found.
                not_found_3:
                  summary: not_found_3
                  value:
                    status: 404
                    code: not_found
                    message: Only uploaded-file documents can be downloaded as ZIP.
      x-mint:
        href: /en/api-reference/documents/download-documents-as-zip
        metadata:
          title: Download Documents as ZIP
          sidebarTitle: Download Documents as ZIP
  /datasets/{dataset_id}/documents/status/{action}:
    patch:
      tags:
      - Documents
      summary: Update Document Status in Batch
      description: Enables, disables, archives, or unarchives multiple documents in one request.
      operationId: batchUpdateDocumentStatus
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Knowledge base ID. From [List Knowledge Bases](/en/api-reference/knowledge-bases/list-knowledge-bases).
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum:
          - enable
          - disable
          - archive
          - un_archive
        description: '`enable` activates documents for retrieval, `disable` deactivates them, `archive` moves them to the archive, `un_archive` restores them from the archive.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - document_ids
              properties:
                document_ids:
                  type: array
                  items:
                    type: string
                  description: Document IDs to update. Get them from [List Documents](/en/api-reference/documents/list-documents).
      responses:
        '200':
          description: Documents updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Operation result.
              examples:
                success:
                  summary: Response Example
                  value:
                    result: success
        '400':
          description: '`invalid_action` : Invalid action, or a document is in a state that does not allow the action (e.g. still indexing, or not completed).'
          content:
            application/json:
              examples:
                invalid_action:
                  summary: invalid_action
                  value:
                    status: 400
                    code: invalid_action
                    message: Invalid action.
        '403':
          description: '`forbidden` : Knowledge base API access is not enabled.'
          content:
            application/json:
              examples:
                forbidden:
                  summary: forbidden (api access)
                  value:
                    status: 403
                    code: forbidden
                    message: Dataset api access is not enabled.
        '404':
          description: '`not_found` : Knowledge base not found.'
          content:
            application/json:
              examples:
                not_found:
                  summary: not_found
                  value:
                    status: 404
                    code: not_found
                    message: Dataset not found.
      x-mint:
        href: /en/api-reference/documents/update-document-status-in-batch
        metadata:
          title: Update Document Status in Batch
          sidebarTitle: Update Document Status in Batch
components:
  schemas:
    Document:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the document.
        position:
          type: integer
          description: Display position of the document in the list.
        data_source_type:
          type: string
          description: How the document was created. `upload_file` for file uploads, `notion_import` for Notion imports.
        data_source_info:
          type: object
          description: Raw data source information, varies by `data_source_type`.
        data_source_detail_dict:
          type: object
          description: Detailed data source information including file details.
        dataset_process_rule_id:
          type: string
          description: ID of the processing rule applied to this document.
        name:
          type: string
          description: Document name.
        created_from:
          type: string
          description: Origin of the document. `api` for API creation, `web` for UI creation.
        created_by:
          type: string
          description: ID of the user who created the document.
        created_at:
          type: number
          description: Creation timestamp (Unix epoch in seconds).
        tokens:
          type: integer
          description: Total number of tokens in the document.
        indexing_status:
          type: string
          description: Current indexing status. `waiting` for queued, `parsing` while extracting content, `cleaning` while removing noise, `splitting` while chunking, `indexing` while building vectors, `completed` when ready, `error` if failed, `paused` if manually paused.
        error:
          type:
          - string
          - 'null'
          description: Error message if indexing failed. `null` when no error.
        enabled:
          type: boolean
          description: Whether the document is enabled for retrieval.
        disabled_at:
          type:
          - number
          - 'null'
          description: Timestamp when the document was disabled. `null` if enabled.
        disabled_by:
          type:
          - string
          - 'null'
          description: ID of the user who disabled the document. `null` if enabled.
        archived:
          type: boolean
          description: Whether the document is archived.
        display_status:
          type: string
          description: User-facing display status derived from `indexing_status` and `enabled` state.
        word_count:
          type: integer
          description: Total word count of the document.
        hit_count:
          type: integer
          description: Number of times the document has been matched in retrieval queries.
        doc_form:
          type: string
          description: Document chunking mode. `text_model` for standard text chunking, `hierarchical_model` for parent-child structure, `qa_model` for QA pair extraction.
        doc_metadata:
          type: array
          description: Metadata values assigned to this document.
          items:
            type: object
            properties:
              id:
                type: string
                description: Metadata field identifier.
              name:
                type: string
                description: Metadata field name.
              type:
                type: string
                description: Metadata field value type.
              value:
                type: string
                description: Metadata value for this document.
        summary_index_status:
          type:
          - string
          - 'null'
          description: Status of the summary index for this document. `null` if summary indexing is not configured.
        need_summary:
          type: boolean
          description: Whether a summary needs to be generated for this document.
    RetrievalModel:
      type: object
      required:
      - search_method
      - reranking_enable
      - top_k
      - score_threshold_enabled
      properties:
        search_method:
          type: string
          description: Search method used for retrieval.
          enum:
          - keyword_search
          - semantic_search
          - full_text_search
          - hybrid_search
        reranking_enable:
          type: boolean
          description: Whether reranking is enabled.
        reranking_model:
          type: object
          description: Reranking model configuration.
          properties:
            reranking_provider_name:
              type: string
              description: 'Reranking model provider identifier, formatted as `organization/plugin_name/provider_name` (e.g. `langgenius/cohere/cohere`). A bare name like `cohere` expands to `langgenius/<name>/<name>` and works only for langgenius-published plugins.


                Get valid values from the `provider` field of [Get Available Models](/en/api-reference/models/get-available-models) with `model_type=rerank`.'
            reranking_model_name:
              type: string
              description: Name of the reranking model.
        reranking_mode:
          type:
          - string
          - 'null'
          enum:
          - reranking_model
          - weighted_score
          description: Reranking mode. Required when `reranking_enable` is `true`.
        top_k:
          type: integer
          description: Maximum number of results to return.
        score_threshold_enabled:
          type: boolean
          description: Whether score threshold filtering is enabled.
        score_threshold:
          type:
          - number
          - 'null'
          description: Minimum similarity score for results. Only effective when `score_threshold_enabled` is `true`.
        weights:
          type:
          - object
          - 'null'
          description: Weight configuration for hybrid search.
          properties:
            weight_type:
              type: string
              description: Strategy for balancing semantic and keyword search weights.
              enum:
              - semantic_first
              - keyword_first
              - customized
            vector_setting:
              type: object
              description: Semantic search weight settings.
              properties:
                vector_weight:
                  type: number
                  description: Weight assigned to semantic (vector) search results.
                embedding_provider_name:
                  type: string
                  description: Provider of the embedding model used for vector search.
                embedding_model_name:
                  type: string
                  description: Name of the embedding model used for vector search.
            keyword_setting:
              type: object
              description: Keyword search weight settings.
              properties:
                keyword_weight:
                  type: number
                  description: Weight assigned to keyword search results.
        metadata_filtering_conditions:
          type:
          - object
          - 'null'
          description: Restrict retrieval to chunks whose document metadata matches the given conditions. Conditions are evaluated server-side against document metadata fields.
          properties:
            logical_operator:
              type:
              - string
              - 'null'
              enum:
              - and
              - or
              default: and
              description: How to combine multiple conditions.
            conditions:
              type:
              - array
              - 'null'
              description: List of metadata conditions to evaluate.
              items:
                type: object
                required:
                - name
                - comparison_operator
                properties:
                  name:
                    type: string
                    description: Metadata field name to compare against.
                  comparison_operator:
                    type: string
                    description: 'Comparison to apply, by metadata type:


                      - String or array metadata: `contains`, `not contains`, `start with`, `end with`, `is`, `is not`, `empty`, `not empty`, `in`, `not in`

                      - Numeric metadata: `=`, `≠`, `>`, `<`, `≥`, `≤`

                      - Time metadata: `before`, `after`'
                    enum:
                    - contains
                    - not contains
                    - start with
                    - end with
                    - is
                    - is not
                    - empty
                    - not empty
                    - in
                    - not in
                    - '='
                    - ≠
                    - '>'
                    - <
                    - ≥
                    - ≤
                    - before
                    - after
                  value:
                    description: 'Value to compare against. Type depends on `comparison_operator`: string for most string operators, array of strings for `in` and `not in`, number for numeric operators, and omitted for `empty` and `not empty`.'
                    oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                    - type: number
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: API_KEY
      description: 'Every request authenticates with an API key: `Authorization: Bearer {API_KEY}`. App endpoints take an app API key; knowledge endpoints take a knowledge base API key ([Get Started](/en/api-reference/guides/get-started)).


        Keep keys server-side; never embed them in client code. Requests with a missing or invalid key fail with HTTP `401` (`unauthorized`).'
