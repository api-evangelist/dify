      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Document ID. Obtain it from [List Documents](/en/api-reference/documents/list-documents).
      - name: segment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Chunk ID. Obtain it from [List Chunks](/en/api-reference/chunks/list-chunks).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - segment
              properties:
