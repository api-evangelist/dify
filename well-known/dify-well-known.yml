description: >-
  Named /.well-known/ probe of every Dify host in this record — the registrable domain and www,
  the API base host from the OpenAPI servers[] block, the docs host, the console host and the
  marketplace host. Only docs.dify.ai serves real documents: an RFC 9727 api-catalog linkset and
  an A2A agent card (both emitted by the Mintlify docs platform Dify runs on its own domain).
notes:
  - >-
    marketplace.dify.ai answers HTTP 200 with the same 155KB single-page-app HTML shell for EVERY
    /.well-known/* path, including paths that cannot exist. Those 200s are recorded as misses, not
    as served documents.
  - >-
    dify.ai, www.dify.ai and cloud.dify.ai return a 404 HTML page for every path; api.dify.ai
    returns a bare 404 with an empty body.
  - >-
    The api-catalog linkset's service-desc href is a short-lived AWS presigned S3 URL generated by
    the docs platform. The credential in that URL was redacted by
    all/0-working/sanitize-secrets.py before commit; re-fetch the live document to resolve it.
