description: Dify is an open-source platform for building AI applications, combining Backend-as-a-Service
  and LLMOps to streamline the development of generative AI solutions for developers and non-technical
  innovators alike. Teams build agentic workflows, chatflows, agents and RAG knowledge pipelines on a
  visual canvas, then publish each one as a web app, an embeddable widget, a REST API or an MCP server.
  Dify is operated by Langgenius, Inc. and ships as Dify Cloud, a self-hosted Community Edition and a
  commercial Enterprise edition.
